name: Trigger auto deployment for styra-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/styra-backend-AutoDeployTrigger-a5a779ac-9cb9-4321-bb6b-7480ca0ba4f9.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write # This is required for requesting the OIDC JWT Token
      contents: read  # Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.STYRABACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.STYRABACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.STYRABACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy container app
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          dockerfilePath: Dockerfile
          containerAppName: styra-backend
          resourceGroup: clothing-app-rg
          imageToBuild: styra-backend:${{ github.sha }}



