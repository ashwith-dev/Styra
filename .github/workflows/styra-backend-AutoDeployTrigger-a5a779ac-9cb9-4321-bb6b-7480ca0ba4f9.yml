name: Trigger auto deployment for styra-backend

on:
  push:
    branches: 
      [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/styra-backend-AutoDeployTrigger-a5a779ac-9cb9-4321-bb6b-7480ca0ba4f9.yml'

  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write # Required for Azure OIDC login
      contents: read
      packages: write # Required to push image to GitHub Packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case repository name
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.STYRABACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.STYRABACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.STYRABACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}
          containerAppName: styra-backend
          resourceGroup: clothing-app-rg
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}




